<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Ahmed Maaloul, AI and Software Engineer</title>
  <desc id="desc">A banner with a soft dark gradient, a name, and a role line.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="260" rx="12" fill="url(#bg)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="128" fill="#f8fafc" font-size="52" font-weight="600">Ahmed Maaloul</text>
    <text x="72" y="174" fill="#94a3b8" font-size="22">AI and Software Engineer · Paris, France</text>
  </g>
</svg>
