<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Ahmed Maaloul, AI and Software Engineer</title>
  <desc id="description">A dark blue engineering themed profile banner with a grid, a monogram, and a concise introduction.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.56" stop-color="#0b2035"/>
      <stop offset="1" stop-color="#103653"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#7dd3fc" stroke-width="1" opacity="0.08"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>

  <circle cx="1090" cy="70" r="125" fill="#38bdf8" opacity="0.05"/>
  <circle cx="1140" cy="310" r="190" fill="#2dd4bf" opacity="0.04"/>
  <path d="M930 60 H1090 L1140 110 V220 L1080 280 H930" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.16"/>
  <circle cx="930" cy="60" r="5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="1090" cy="60" r="5" fill="#2dd4bf" opacity="0.8"/>
  <circle cx="1140" cy="110" r="5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="1080" cy="280" r="5" fill="#2dd4bf" opacity="0.8"/>

  <rect x="68" y="70" width="120" height="120" rx="24" fill="#0b1b2c" stroke="url(#accent)" stroke-width="3"/>
  <text x="128" y="146" text-anchor="middle" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="46" font-weight="700">AM</text>
  <circle cx="174" cy="84" r="5" fill="#2dd4bf" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <text x="224" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="54" font-weight="750">Ahmed Maaloul</text>
  <text x="226" y="159" fill="#7dd3fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="650" letter-spacing="4">AI &amp; SOFTWARE ENGINEER</text>
  <rect x="226" y="183" width="508" height="4" rx="2" fill="url(#accent)"/>

  <text x="226" y="230" fill="#dbeafe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22">Reliable AI systems</text>
  <circle cx="420" cy="223" r="4" fill="#2dd4bf"/>
  <text x="438" y="230" fill="#dbeafe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22">Practical engineering</text>
  <circle cx="670" cy="223" r="4" fill="#38bdf8"/>
  <text x="688" y="230" fill="#dbeafe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22">Honest experiments</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
    <rect x="226" y="266" width="112" height="38" rx="19" fill="#0f2940" stroke="#38bdf8" stroke-opacity="0.42"/>
    <text x="282" y="291" text-anchor="middle" fill="#bae6fd">PARIS</text>
    <rect x="352" y="266" width="120" height="38" rx="19" fill="#0f2940" stroke="#38bdf8" stroke-opacity="0.42"/>
    <text x="412" y="291" text-anchor="middle" fill="#bae6fd">PYTHON</text>
    <rect x="486" y="266" width="80" height="38" rx="19" fill="#0f2940" stroke="#2dd4bf" stroke-opacity="0.42"/>
    <text x="526" y="291" text-anchor="middle" fill="#99f6e4">GO</text>
    <rect x="580" y="266" width="88" height="38" rx="19" fill="#0f2940" stroke="#2dd4bf" stroke-opacity="0.42"/>
    <text x="624" y="291" text-anchor="middle" fill="#99f6e4">C++</text>
  </g>

  <rect x="0" y="348" width="1200" height="12" rx="6" fill="url(#accent)" opacity="0.9"/>
</svg>
